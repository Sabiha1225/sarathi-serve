seed: 42
log_level: info
# output_dir: ./benchmark_output/
output_dir: /home/sabiha/sarathi_observation2/benchmark_output/figure-1/
write_json_trace: true
write_chrome_trace: true
write_metrics: true
enable_profiling: false
gpu_memory_utilization: 0.85
# gpu_memory_utilization: 0.25
# time_limit: 1800 # seconds
time_limit: 16200 # seconds
replica_resource_mapping: ""

cluster:
  num_replicas: 1

model:
  # name: meta-llama/Meta-Llama-3-8B
  # name: meta-llama/Llama-2-7b
  name: meta-llama/Llama-2-7b-hf
  # tensor_parallel_degree: 4
  tensor_parallel_degree: 2
  # pipeline_parallel_degree: 2
  pipeline_parallel_degree: 1
  max_model_len: 20480
  load_format: dummy
  attention_backend: flash_attention

request_generator:
  provider: synthetic
  #provider: trace_replay

synthetic_request_generator:
  length_provider: trace
  # interval_provider: static
  interval_provider: poisson
  num_requests: 1

trace_request_generator:
  trace_file: ~/sarathi_observation2/sarathi/benchmark/data/processed_traces/custom_length_traces/long_input_10000_long_output_8000.csv
  date: '2023-08-21'
  prefill_scale_factor: 1
  decode_scale_factor: 1
  time_scale_factor: 0.04
  max_tokens: 20480

# Config for synthetic trace generator
trace_request_length_generator:
  #trace_file: ~/sarathi-serve/sarathi/benchmark/data/processed_traces/sharegpt_8k_filtered_stats_llama2_tokenizer.csv
  # trace_file: ./data/processed_traces/arxiv_summarization_filtered_stats_llama2_tokenizer.csv
  #prefill_scale_factor: 1
  #decode_scale_factor:  1
  #max_tokens: 4096
  trace_file: ~/sarathi_observation2/sarathi/benchmark/data/processed_traces/custom_length_traces/long_input_10000_long_output_8000.csv
  date: '2023-08-21'
  prefill_scale_factor: 1
  decode_scale_factor: 1
  time_scale_factor: 0.04
  max_tokens: 20480

trace_request_interval_generator:
  trace_file: ~/sarathi_observation2/sarathi/benchmark/data/processed_traces/AzureFunctionsInvocationTraceForTwoWeeksJan2021Processed.csv
  start_time: "1970-01-04 12:00:00"
  end_time: "1970-01-04 15:00:00"
  time_scale_factor: 0.3

poisson_request_interval_generator:
  qps: 1.0

gamma_request_interval_generator:
  cv: 0.5
  qps: 0.2

zipf_request_length_generator:
  theta: 0.6
  scramble: false
  min_tokens: 1024
  max_tokens: 4096
  prefill_to_decode_ratio: 20.0

uniform_request_length_generator:
  min_tokens: 1024
  max_tokens: 4096
  prefill_to_decode_ratio: 20.0

fixed_request_length_generator:
  prefill_tokens: 4096
  decode_tokens: 512

replica_scheduler:
  provider: sarathi
  max_batch_size: 256
  policy_name: fcfs   # placeholder default, overridden per-run by the sweep script

scheduler_policy:
  ttft_slo_ms: 2500
  tpot_slo_ms: 150

sarathi_scheduler:
  # chunk_size: 1536
  chunk_size: 128
  enable_rolling_prefills: true
  enable_dynamic_chunking_schedule: false
  # next four params apply only when using dynamic schedule
  low_chunk_size: 128
  high_chunk_size: 4096
  # chunk_schedule_max_tokens: 4096
  chunk_schedule_max_tokens: 131072
  chunk_schedule_stages: 16

vllm_scheduler:
  max_tokens_in_batch: 20480

simple_chunking_scheduler:
  chunk_size: 512

metrics_store:
  wandb_project: "llm-simulator"
  wandb_sweep_id: ""
  wandb_run_id: ""
  wandb_group: "vllm_generation_stalls_experiments"
  wandb_run_name: "Yi-34B-200K_tp_2_arxiv-summarization_filtered_seq20480_static_num_reqs_128_vllm_chunk_size_None_batch_size_256_55e75be9"
  enable_op_level_metrics: false
  enable_cpu_op_level_metrics: false
  enable_request_outputs: false
  keep_individual_batch_metrics: true
